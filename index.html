<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DAFTAR GAMBAR // BR PUNYA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#ffd400;--amber:#ff9d00;--bg:#030405;--panel:rgba(8,10,12,.78);--line:rgba(255,212,0,.18)}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#fff;min-height:100vh;overflow-x:hidden}

/* BACKGROUND */
#stars{position:fixed;inset:0;z-index:-6;pointer-events:none}
.grid{position:fixed;inset:0;z-index:-5;pointer-events:none;opacity:.24;background-image:
linear-gradient(rgba(255,212,0,.06) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,212,0,.06) 1px,transparent 1px);
background-size:55px 55px;
transform:perspective(500px) rotateX(60deg) scale(1.8);
transform-origin:center bottom;
animation:gridMove 8s linear infinite}
@keyframes gridMove{to{background-position:0 55px,55px 0}}
.vignette{position:fixed;inset:0;z-index:-3;pointer-events:none;background:radial-gradient(circle at center,transparent 25%,rgba(0,0,0,.5) 100%)}
.beam{position:fixed;z-index:-2;width:45%;height:2px;left:-50%;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 20px 4px rgba(255,212,0,.35);animation:beam 6s linear infinite;transform:rotate(-18deg)}
@keyframes beam{0%{top:20%;left:-55%}100%{top:78%;left:110%}}
.orb{position:fixed;border-radius:50%;filter:blur(75px);opacity:.2;z-index:-4;pointer-events:none}
.a{width:430px;height:430px;background:#ffd000;left:-210px;top:8%;animation:oa 13s ease-in-out infinite alternate}
.b{width:350px;height:350px;background:#ff6500;right:-180px;top:42%;animation:ob 16s ease-in-out infinite alternate}
.c{width:300px;height:300px;background:#fff08a;left:35%;bottom:-220px;animation:oc 18s ease-in-out infinite alternate}
@keyframes oa{to{transform:translate(300px,180px)}}@keyframes ob{to{transform:translate(-280px,-170px)}}@keyframes oc{to{transform:translate(160px,-220px)}}

/* HEADER */
header{position:relative;padding:48px 20px 28px;text-align:center;border-bottom:1px solid rgba(255,212,0,.12)}
.topline{font-size:10px;letter-spacing:4px;color:#777;margin-bottom:16px}
.topline span{color:var(--gold)}
.logo{display:inline-flex;align-items:center;gap:9px;padding:8px 14px;border:1px solid rgba(255,212,0,.3);background:rgba(255,212,0,.035);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);box-shadow:0 0 28px rgba(255,212,0,.06)}
.status{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 7px var(--gold),0 0 20px var(--gold);animation:pulse 1.3s infinite}
.logo b{font-size:10px;letter-spacing:2px;color:#e7e7e7}
@keyframes pulse{50%{transform:scale(1.8);opacity:.45}}
h1{
  font-size:clamp(30px,6vw,58px);
  letter-spacing:7px;
  margin:18px 0 9px;
  font-weight:900;
  color:#fff;
  text-shadow:
    0 0 6px rgba(255,255,255,.45),
    0 0 18px rgba(255,255,255,.25),
    0 0 35px rgba(255,212,0,.15);
}

h1 span{
  color:var(--gold);
  text-shadow:
    0 0 8px var(--gold),
    0 0 18px var(--gold),
    0 0 40px rgba(255,157,0,.55),
    0 0 70px rgba(255,157,0,.25);
}
.subtitle{color:#888;font-size:13px;letter-spacing:.5px}

/* MAIN */
.main{width:92%;max-width:1280px;margin:24px auto 70px}
.dashboard{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:18px}
.search{position:relative}
.search input{width:100%;padding:14px 18px 14px 43px;background:rgba(5,7,8,.85);border:1px solid var(--line);color:#fff;outline:0;border-radius:10px;font-size:12px;backdrop-filter:blur(10px)}
.search input:focus{border-color:rgba(255,212,0,.6);box-shadow:0 0 25px rgba(255,212,0,.09)}
.search:before{content:"⌕";position:absolute;z-index:2;left:15px;top:8px;color:var(--gold);font-size:23px}
.stats{display:flex;gap:8px}
.stat{min-width:105px;padding:11px 14px;border:1px solid var(--line);background:var(--panel);border-radius:10px;text-align:center;font-size:9px;color:#666;letter-spacing:1px}
.stat strong{display:block;color:var(--gold);font-size:15px;margin-top:3px}
.section{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px;padding-bottom:10px;border-bottom:1px solid rgba(255,212,0,.1)}
.section-title{font-size:11px;letter-spacing:2px;color:#aaa}.section-title b{color:var(--gold)}
.section-right{font-size:9px;color:#555;letter-spacing:1px}

/* CARDS */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:18px}
.card{position:relative;overflow:hidden;background:var(--panel);border:1px solid rgba(255,212,0,.13);clip-path:polygon(0 0,calc(100% - 13px) 0,100% 13px,100% 100%,13px 100%,0 calc(100% - 13px));box-shadow:0 14px 35px rgba(0,0,0,.4);transition:.35s;animation:cardIn .55s both}
.card:hover{transform:translateY(-8px);border-color:rgba(255,212,0,.6);box-shadow:0 20px 55px rgba(0,0,0,.7),0 0 28px rgba(255,212,0,.12)}
.card:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.12) 48%,transparent 62%);transform:translateX(-130%);transition:.75s;z-index:5;pointer-events:none}
.card:hover:before{transform:translateX(130%)}
@keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.image{height:220px;background:#0b0c0d;position:relative;overflow:hidden;cursor:pointer}
.image img{width:100%;height:100%;object-fit:cover;display:block;transition:.55s}
.card:hover .image img{transform:scale(1.08);filter:saturate(1.12) contrast(1.03)}
.corner{position:absolute;z-index:4;width:14px;height:14px;border-color:var(--gold);opacity:.7}
.tl{top:8px;left:8px;border-top:1px solid;border-left:1px solid}.tr{top:8px;right:8px;border-top:1px solid;border-right:1px solid}
.bl{bottom:8px;left:8px;border-bottom:1px solid;border-left:1px solid}.br{bottom:8px;right:8px;border-bottom:1px solid;border-right:1px solid}
.num{position:absolute;top:10px;left:10px;padding:5px 8px;background:rgba(0,0,0,.72);border:1px solid rgba(255,212,0,.22);color:var(--gold);font-size:9px;z-index:6}
.viewtag{position:absolute;right:10px;top:10px;padding:5px 8px;background:rgba(0,0,0,.7);color:#ddd;font-size:9px;opacity:0;transition:.25s;z-index:6}.card:hover .viewtag{opacity:1}
.info{padding:13px}.name{font-size:12px;font-weight:700;color:#eee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:11px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.btn{border:1px solid rgba(255,212,0,.25);padding:9px 5px;border-radius:7px;text-align:center;text-decoration:none;font-size:9px;font-weight:800;cursor:pointer;transition:.25s}
.download{background:linear-gradient(135deg,#ffe000,#ff9e00);color:#111;box-shadow:0 0 15px rgba(255,190,0,.1)}.download:hover{box-shadow:0 0 25px rgba(255,210,0,.4);transform:translateY(-1px)}
.preview{color:#ffd85a;background:rgba(255,212,0,.035)}.preview:hover{background:rgba(255,212,0,.12)}
.empty{display:none;padding:65px;text-align:center;color:#666;border:1px dashed rgba(255,212,0,.18);border-radius:10px}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.94);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:25px;z-index:99}
.modal.active{display:flex}
.modal img{max-width:94%;max-height:87vh;border:1px solid rgba(255,212,0,.3);box-shadow:0 0 70px rgba(255,212,0,.12)}
.close{position:fixed;right:22px;top:18px;width:42px;height:42px;border-radius:50%;background:#0b0c0d;color:#fff;border:1px solid var(--line);font-size:27px;cursor:pointer}.close:hover{background:var(--gold);color:#111}

/* LOADER */
.loader{position:fixed;inset:0;background:#030405;z-index:999;display:flex;align-items:center;justify-content:center;transition:.6s}
.loader.hide{opacity:0;visibility:hidden}
.loadbox{text-align:center;width:230px}.loadlogo{font-size:20px;font-weight:900;letter-spacing:4px}.loadlogo span{color:var(--gold)}
.bar{height:2px;background:#222;margin-top:18px;overflow:hidden}.bar i{display:block;width:30%;height:100%;background:var(--gold);box-shadow:0 0 15px var(--gold);animation:load 1.2s infinite}.loadtext{font-size:9px;color:#666;letter-spacing:2px;margin-top:9px}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(430%)}}
footer{padding:28px;text-align:center;color:#444;border-top:1px solid rgba(255,255,255,.06);font-size:10px;letter-spacing:1px}

@media(max-width:650px){
header{padding:42px 15px 25px}h1{letter-spacing:4px}.main{width:94%}.dashboard{grid-template-columns:1fr}.stats{display:grid;grid-template-columns:1fr 1fr}.gallery{grid-template-columns:repeat(2,1fr);gap:11px}.image{height:155px}.info{padding:9px}.name{font-size:10px}.btn{font-size:8px;padding:9px 2px}.grid{background-size:35px 35px}
}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="loadbox">
    <div class="loadlogo">DAFTAR <span>GAMBAR</span></div>
    <div class="bar"><i></i></div>
    <div class="loadtext">INITIALIZING GALLERY...</div>
  </div>
</div>

<canvas id="stars"></canvas>
<div class="grid"></div><div class="vignette"></div><div class="beam"></div>
<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>

<header>
  <div class="topline">SYSTEM <span>//</span> ONLINE <span>//</span> IMAGE DATABASE</div>
  <div class="logo"><i class="status"></i><b>BR GALLERY SYSTEM</b></div>
  <h1>DAFTAR <span>GAMBAR</span></h1>
  <p class="subtitle">Pilih gambar • Lihat preview • Download dengan mudah</p>
</header>

<main class="main">
  <div class="dashboard">
    <div class="search"><input id="search" placeholder="SEARCH IMAGE DATABASE..." autocomplete="off"></div>
    <div class="stats">
      <div class="stat">TOTAL<strong id="total">0</strong></div>
      <div class="stat">STATUS<strong>ONLINE</strong></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">◈ <b>IMAGE DATABASE</b></div>
    <div class="section-right">LIVE // READY</div>
  </div>

  <div class="gallery" id="gallery"></div>
  <div class="empty" id="empty">NO IMAGE FOUND</div>
</main>

<div class="modal" id="modal">
  <button class="close" onclick="closeModal()">×</button>
  <img id="modalImg" alt="Preview">
</div>

<footer>© 2026 // DAFTAR GAMBAR // BR PUNYA</footer>

<script>
/* =========================================
   CUKUP TAMBAHKAN NAMA FILE GAMBAR DI SINI
   ========================================= */
const images=[

            "CEK LIMIT DANA.png",
            "CEK NOMOR DANA.png",
            "BUKTI DOWNLOAD APK.png",
            "CARA KIRIM GAMBAR.jpg",
            "PROFIL DANA.jpg",
            "QRIS BANK JAGO.png",
            "QRIS BCA 2.png",
            "QRIS BCA.png",
            "QRIS GOPAY.jpg",
            "QRIS BRI.png",
            "QRIS DANA.png",
            "QRIS LINK AJA.png",
            "QRIS OCTO.png", 
            "QRIS OVO.png",
            "QRIS SEABANK.png",
            "QRIS SHOPE.png",
            "QRIS WONDR.png",
            "QRIS MANDIRI.jpg",
            "CONTOH MBANKING BANK JAGO.png",
            "CEK AKTIVITAS BRI.png",
            "CONTOH MBANKING BRI.png",
            "RIWAYAT AKTIVITAS DANA.jpg",
            "SBO BET.png",
            "CARA DEPO.jpg",
            "CARA KIRIM UANG DANA.png",
            "RIWAYAT GOPAY.png",
            "LUPA PASSWORD 2.png",
            "PROFIL GOPAY.jpg",
            "HADIAH COLOK MACAU 5D.jpg",
            "LOGOUT POKER.jpg",
            "CONTOH KTP.jpg",
            "KING KONG.jpg",
            "HISTORY SLOT.png",
            "MODE DEKSTOP.png",
            "CARA DEPOSIT QRIS.jpg",
            "MENU TOGEL.png",
            "MENU UBAH PASSWORD.png",
            "DANAMON.png",
            "HADIAH HIBURAN.jpg",
            "DETAIL QRIS BCA.jpg",
            "PROFIL OVO.png",
            "PROFIL LINKAJA.png",
            "SEABANK.png",
            "LIMIT LINK AJA.jpg",
            "FULL SERVICE LINKAJA.png",
            "LIMIT GOPAY.png",
            "CONTOH MBANKING MANDIRI.jpg",
            "MENU TRANSAKSI.png",
            "PERIODE SPACEMAN.jpg",
            "POLA 15.png",
            "REPLAY KEMENANGAN.jpg",
            "TOGEL DASAR.png",
            "SCATER HITAM.jpg",
            "RIWAYAT PERMAINAN.png",
            "SUPER SCATER.jpg",
            "TUJUAN DANA.png",
            "VPN INDONESIA.jpg",
            "SOUVENIR.jpg",
            "QRIS GANGGUAN.png",
            "QRIS NORMAL.png",
            "BNI QRIS.png",
            "BUKTI QRIS LINKAJA.png",
            "TAB SAMARAN.jpg"





      
];

const gallery=document.getElementById("gallery");
const total=document.getElementById("total");
const empty=document.getElementById("empty");
total.textContent=images.length;

function render(q=""){
  gallery.innerHTML="";
  let n=0;
  images.forEach((file,i)=>{
    if(!file.toLowerCase().includes(q.toLowerCase()))return;
    n++;
    const path="images/"+file;
    const card=document.createElement("article");
    card.className="card";
    card.style.animationDelay=(n*.035)+"s";
    card.innerHTML=`
      <div class="image" onclick="openModal('${path}')">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <span class="num">IMG-${String(i+1).padStart(3,"0")}</span>
        <span class="viewtag">PREVIEW</span>
        <img src="${path}" alt="${file}" loading="lazy">
      </div>
      <div class="info">
        <div class="name" title="${file}">${file}</div>
        <div class="actions">
          <a class="btn download" href="${path}" download="${file}">↓ DOWNLOAD</a>
          <button class="btn preview" onclick="openModal('${path}')">◉ PREVIEW</button>
        </div>
      </div>`;
    gallery.appendChild(card);
  });
  empty.style.display=n?"none":"block";
}
render();

document.getElementById("search").addEventListener("input",e=>render(e.target.value));
function openModal(path){document.getElementById("modalImg").src=path;document.getElementById("modal").classList.add("active")}
function closeModal(){document.getElementById("modal").classList.remove("active")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
window.addEventListener("load",()=>setTimeout(()=>document.getElementById("loader").classList.add("hide"),650));

/* ANIMATED PARTICLES */
const c=document.getElementById("stars"),ctx=c.getContext("2d");let W,H,p=[];
function resize(){W=c.width=innerWidth;H=c.height=innerHeight}
function init(){
 p=Array.from({length:95},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.25,s:Math.random()*.5+.08,a:Math.random()*.65+.1,dx:(Math.random()-.5)*.22}))
}
function animate(){
 ctx.clearRect(0,0,W,H);
 p.forEach(x=>{
   x.y-=x.s;x.x+=x.dx;
   if(x.y<0)x.y=H;if(x.x<0)x.x=W;if(x.x>W)x.x=0;
   ctx.beginPath();ctx.arc(x.x,x.y,x.r,0,Math.PI*2);
   ctx.fillStyle=`rgba(255,215,80,${x.a})`;ctx.shadowBlur=9;ctx.shadowColor="#ffd400";ctx.fill();
 });
 requestAnimationFrame(animate)
}
resize();init();animate();addEventListener("resize",()=>{resize();init()});
</script>
</body>
</html>
